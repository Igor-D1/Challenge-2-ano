server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: quiz

  # Configuração de Conexão JDBC para Oracle Database (FIAP AMazul)
  datasource:
    url: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
    driver-class-name: oracle.jdbc.OracleDriver
    username: RMXXXXXX # Será informado ou enviado o RM junto da senha ao professor
    password: password # Será informado ou enviado o RM junto da senha ao professor


  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update # Use 'update' ou 'validate'
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
